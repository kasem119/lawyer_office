# إعداد Nginx لمنظومة مكتب المحاماة على VPS
# يعمل فوراً على المنفذ 80 (وعبر عنوان الـ IP مباشرة)
# وجاهز لإصدار شهادة SSL تلقائياً عبر certbot بمجرد توفر الدومين.

server {
    listen 80;
    listen [::]:80;
    server_name muhami.ly www.muhami.ly 102.203.202.104 _;

    # رفع الملفات حتى 50MB (مستندات ممسوحة ضوئياً + صور متعددة مدمجة في PDF)
    client_max_body_size 55M;

    # مسار التحقق من شهادة Let's Encrypt (Certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # ملفات الواجهة الثابتة (تقديم مباشر فائق السرعة عبر Nginx مع دعم كامل لـ CORS)
    location /assets/ {
        alias /opt/lawyer_office/client/dist/assets/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin *;
        access_log off;
    }

    # Service Worker & Manifest & Favicon (بدون كاش لضمان وصول التحديثات فوراً)
    location ~* (sw\.js|manifest\.json|favicon\.svg)$ {
        root /opt/lawyer_office/client/dist;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Access-Control-Allow-Origin *;
    }

    # WebSocket للإشعارات الحية
    location /ws {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # توجيه جميع الطلبات الأخرى إلى خادم Node.js
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
