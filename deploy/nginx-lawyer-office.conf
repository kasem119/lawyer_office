# إعداد Nginx لمنظومة مكتب المحاماة على VPS
# انسخ هذا الملف إلى: /etc/nginx/sites-available/lawyer-office
# ثم: ln -s /etc/nginx/sites-available/lawyer-office /etc/nginx/sites-enabled/
#
# استبدل office.example.com بدومينك الحقيقي.

server {
    listen 80;
    listen [::]:80;
    server_name office.example.com;

    # certbot سيعدّل هذا الملف تلقائياً لإضافة إعادة التوجيه للـ HTTPS
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name office.example.com;

    # شهادة Let's Encrypt (سيولدها certbot)
    ssl_certificate     /etc/letsencrypt/live/office.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/office.example.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # أمان إضافي
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # رفع الملفات حتى 30MB (مستندات ممسوحة ضوئياً)
    client_max_body_size 30M;

    # الواجهة والخادم على نفس المنفذ الداخلي (Node.js)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # WebSocket للإشعارات الحية
    location /ws {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # ملفات ثابتة من الواجهة المبنية (كاش أسبوع)
    location /assets/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
